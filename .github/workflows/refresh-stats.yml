name: Refresh profile stats

# Renders the profile README's stats SVGs from live public APIs once a week
# (and on demand). All data comes from GitHub + npm — no third-party counter
# services. The commit is authored by the github-actions bot.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays, off the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Render stats SVGs from live APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh-stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain assets/)" ]]; then
            git add assets/
            git commit -m "stats: weekly refresh from public APIs"
            git push
          else
            echo "No changes to stats."
          fi
